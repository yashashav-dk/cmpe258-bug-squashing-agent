<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bug Squashing Agent — Benchmark UI</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="header">
    <div class="header-inner">
      <div class="logo">
        <span class="logo-icon">🤖</span>
        <div>
          <div class="logo-title">Bug Squashing Agent</div>
          <div class="logo-sub">Manifest-driven benchmark workflow</div>
        </div>
      </div>
      <div class="header-badges">
        <span class="badge badge-green" id="status-badge">Ready</span>
      </div>
    </div>
  </header>

  <main class="main">
    <section class="card control-panel">
      <h2 class="card-title">Run Benchmark</h2>
      <div class="form-grid">
        <div class="form-group">
          <label class="form-label" for="manifest-select">Manifest</label>
          <select id="manifest-select" class="select"></select>
        </div>
        <div class="form-group">
          <label class="form-label" for="models-input">Models</label>
          <input id="models-input" class="select" value="gemini" />
        </div>
        <div class="form-group">
          <label class="form-label" for="max-steps-input">Max Steps</label>
          <input id="max-steps-input" class="select" value="15" />
        </div>
        <div class="form-group">
          <label class="form-label" for="timeout-input">Timeout (s)</label>
          <input id="timeout-input" class="select" value="180" />
        </div>
      </div>
      <div class="action-row">
        <button id="run-btn" class="btn btn-primary" onclick="runManifest()">Run Manifest</button>
        <button class="btn btn-ghost" onclick="analyzeLatest()">Analyze Latest</button>
      </div>
    </section>

    <section class="card control-panel">
      <h2 class="card-title">Build Manifest</h2>
      <div class="form-grid">
        <div class="form-group">
          <label class="form-label" for="historical-source">Historical Source</label>
          <input id="historical-source" class="select" value="benchmark/data/historical_cases.sample.jsonl" />
        </div>
        <div class="form-group">
          <label class="form-label" for="synthetic-source">Synthetic Source</label>
          <input id="synthetic-source" class="select" value="benchmark/data/synthetic_templates.sample.jsonl" />
        </div>
        <div class="form-group">
          <label class="form-label" for="manifest-output">Manifest Output</label>
          <input id="manifest-output" class="select" value="benchmark/manifests/pilot_hybrid.jsonl" />
        </div>
      </div>
      <div class="action-row">
        <button class="btn btn-primary" onclick="buildManifest()">Build Manifest</button>
      </div>
    </section>

    <section class="card output-panel">
      <h2 class="card-title">Output</h2>
      <pre id="output-stream" class="code-block"></pre>
    </section>
  </main>

  <script src="/static/app.js"></script>
</body>
</html>
